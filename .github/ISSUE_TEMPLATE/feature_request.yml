name: Feature request
description: Suggest a new behavior, mode, character, or `mc` verb
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What play experience or agent behavior would this unlock?
      placeholder: |
        I want characters to recognize when a player is AFK and quietly wander instead of getting stuck following.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Companion mode
        - Civilization mode
        - Landfolk mode
        - mc CLI (perception or action verb)
        - Bot server (bot/server.js or bot/lib/)
        - SOUL / character prompt
        - Tooling / launcher / CI
        - Docs
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Rough sketch of how it would work — new command, new perception filter, new SOUL clause, new launcher flag, etc.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
    validations:
      required: false
  - type: checkboxes
    id: fair-play
    attributes:
      label: Fair-play check
      description: HermesCraft tries to avoid omniscient or god-mode behavior.
      options:
        - label: This feature does not require giving agents privileged information (e.g. full entity lists, chest contents through walls, exact mob coordinates)
          required: false
